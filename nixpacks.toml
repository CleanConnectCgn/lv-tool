# Stellt sicher, dass `pg_dump` im Build-Image verfügbar ist (Block 4,
# Backup-Worker). Gilt für beide Railway-Dienste, die aus diesem Repo
# deployt werden - für den Web-Server ist das Paket ungenutzt, aber
# unschädlich (kein Laufzeit-Overhead, nur etwas größeres Image).
#
# Explizit postgresql_18 statt der generischen "postgresql"-Referenz: die
# generische Referenz löste im von Nixpacks gepinnten Nixpkgs-Snapshot auf
# Version 17.2 auf, während der Railway-Postgres-Dienst 18.4 läuft - pg_dump
# verweigert den Dump gegen eine neuere Server-Version als sich selbst
# ("server version mismatch"), live per Fehlermeldung gefunden.
[phases.setup]
nixPkgs = ["...", "postgresql_18"]
